#
esphome:
  name: smart_blinds

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  password: ""

ota:
  - platform: esphome
    password: ""

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback hotspot if WiFi fails
  ap:
    ssid: "Smart Blinds Fallback Hotspot"
    password: "efHvj6Nu5NKm"

captive_portal:

# -----------------------------
# Position Tracking
# -----------------------------
# globals:
#   - id: blind_position
#     type: float
#     restore_value: yes
#     initial_value: "0.0"

# -----------------------------
# Cover (the blinds entity)
# -----------------------------
cover:
  - platform: template
    name: "Window Blinds"
    id: window_blinds
    device_class: blind

    open_action:
      - output.turn_on: motor_forward
      # Replace the below with hall effect code
      - delay: 5s
      - output.turn_off: motor_forward

    close_action:
      - output.turn_on: motor_reverse
      - delay: 5s
      - output.turn_off: motor_reverse

    stop_action:
      - output.turn_off: motor_enable
      - output.turn_off: motor_forward
      - output.turn_off: motor_reverse

    optimistic: true
    has_position: false

# -----------------------------
# Motor driver (L298N)
# -----------------------------
output:
  - platform: gpio
    pin: GPIO3 # D1 - IN1 on L298N
    id: motor_forward
  - platform: gpio
    pin: GPIO4 # D2 - IN2 on L298N
    id: motor_reverse
  - platform: gpio
    pin: GPIO5 # D3 - ENA on L298N (PWM-capable)
    id: motor_enable
